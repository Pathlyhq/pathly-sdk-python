# Keeps a "chore(main): release x.y.z" PR up to date (CHANGELOG.md + version).
# Merging it creates the vX.Y.Z tag and the GitHub release, then publishes
# that tag. The publish job lives in this workflow (not on "push: tags")
# because a tag created with GITHUB_TOKEN does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PyPI Trusted Publishing (OIDC): no PYPI_TOKEN secret. On pypi.org, add
  # Pathly-Monitoring/pathly-sdk-python, workflow release-please.yml,
  # environment pypi as trusted publisher of the "pathly" project.
  publish-pypi:
    needs: build-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pathly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
