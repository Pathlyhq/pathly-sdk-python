[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pathly"
version = "0.1.0"
description = "Official Python SDK for the Pathly public /v1 API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Simon Raynaud / keyral" }]
maintainers = [{ name = "Pathly", email = "devs@pathlyhq.com" }]
keywords = ["pathly", "pathlyhq", "monitoring", "synthetic-monitoring", "saas", "sla", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://pathlyhq.com"
Documentation = "https://pathlyhq.com/en/developers"
Repository = "https://github.com/pathlyhq/pathly-sdk-python"
Issues = "https://github.com/pathlyhq/pathly-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pathly"]

[tool.hatch.build.targets.sdist]
include = ["src/pathly", "README.md", "README.fr.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pathly --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["pathly"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 100
